# CICD-101 P0.2: explicit deny-list. Hard-fail if any forbidden package appears
# in dependencies / devDependencies / overrides / resolutions / peerDependencies /
# optionalDependencies, OR as a transitive in package-lock.json.
# Adding a new entry here requires CODEOWNERS approval (Tech Head + CTO + Reda + ML Head).
# Removing an entry: same approval — document why the package is no longer forbidden.
[forbidden.jquery]
reason = "DOM-manipulation lib superseded by React; security maintenance only"
[forbidden.moment]
reason = "Use date-fns / dayjs / Temporal"
[forbidden.lodash]
reason = "Use lodash-es with tree-shaking, or stdlib"
# lodash is bundled transitively by widely-used approved upstream packages
# (@nivo/* family, @trivago/prettier-plugin-sort-imports, jest, eslint
# internals). Direct use is still blocked by (1) the per-vector forbidden
# check (deps/devDeps/peer/opt) and (2) ESLint's no-restricted-imports rule
# on the consumer side (defense in depth). transitive_exempt skips lodash
# in the lockfile transitive scan; override_exempt additionally allows it
# in the `overrides` / `resolutions` vectors so consumers can pin the
# bundled transitive copy to a CVE-safe floor (e.g., ">=4.18.0") without
# the dep-approval gate tripping on the forbidden list.
transitive_exempt = true
override_exempt = true
[forbidden.request]
reason = "Deprecated 2020; use undici or fetch"
[forbidden."request-promise"]
reason = "Deprecated; use undici or fetch"
[forbidden.bluebird]
reason = "Use native Promises"
# bluebird is bundled transitively by `unzipper@~0.10` which is itself a
# dependency of `exceljs@4.4.0` (only currently published .xlsx read+write
# lib that is in APPROVED_DEPS). Latest unzipper@0.12 still depends on
# bluebird, and exceljs is unavoidable for the .xlsx import/export feature
# in fe-streaming (Bulk-cameras). Direct use is still blocked by the
# per-vector forbidden check. transitive_exempt skips bluebird in the
# lockfile transitive scan.
transitive_exempt = true
[forbidden.bower]
reason = "Deprecated package manager"
[forbidden.coffeescript]
reason = "Deprecated language; use TypeScript"
[forbidden.async]
reason = "Use async/await"
# async is bundled transitively by `archiver@^5` which is itself a
# dependency of `exceljs@4.4.0`. Latest archiver@8 still pins
# `async@^3.2.4`, and exceljs is unavoidable for the .xlsx
# import/export feature in fe-streaming (Bulk-cameras). Direct use
# is still blocked by the per-vector forbidden check.
# transitive_exempt skips async in the lockfile transitive scan.
transitive_exempt = true
[forbidden.underscore]
reason = "Use stdlib or lodash-es"
[forbidden."prototype"]
reason = "Legacy DOM lib"
[forbidden.gulp]
reason = "Use vite/esbuild"
[forbidden.grunt]
reason = "Use vite/esbuild"
[forbidden.karma]
reason = "Use vitest/playwright"
[forbidden.enzyme]
reason = "Use @testing-library/react"