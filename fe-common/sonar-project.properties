sonar.organization=matrice-ai
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.exclusions=node_modules/**,.next/**,out/**,public/**,coverage/**,.github/**,.git/**,dist/**
sonar.coverage.exclusions=**/*.test.*,**/*.spec.*,**/mocks/**,**/*.stories.*
# Duplication: primitives/* intentionally mirror ui/* as two public entry points
# of the package (exports "." vs "./primitives"). Stories and tests also
# legitimately duplicate scaffolding (render wrappers, mock props). Excluded
# from CPD so Sonar doesn't penalise known-intentional copies.
sonar.cpd.exclusions=src/components/primitives/**,**/*.stories.tsx,**/*.stories.ts,**/*.test.tsx,**/*.test.ts,**/*.spec.tsx,**/*.spec.ts
sonar.qualitygate.wait=true
